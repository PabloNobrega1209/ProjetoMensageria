services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_password
    volumes:
      - orders_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_user -d orders_db"]
      interval: 3s
      retries: 20

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --project=marketplace-local --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      ORDERS_DATABASE_URL: postgres://orders_user:orders_password@postgres:5432/orders_db
    depends_on:
      postgres:
        condition: service_healthy

  consumer:
    build: .
    command: node dist/messaging/start.js
    environment:
      ORDERS_DATABASE_URL: postgres://orders_user:orders_password@postgres:5432/orders_db
      PUBSUB_EMULATOR_HOST: pubsub:8085
      GOOGLE_CLOUD_PROJECT: marketplace-local
      PUBSUB_TOPIC: marketplace-orders
      PUBSUB_SUBSCRIPTION: marketplace-orders-sub
      PUBSUB_AUTO_CREATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      pubsub:
        condition: service_started

volumes:
  orders_pgdata:
